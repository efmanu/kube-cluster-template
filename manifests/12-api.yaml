apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # Public test image so the whole chain runs with no build step.
          # When you build the real Node.js API, swap this back to
          #   <your-dockerhub-user>/demo-api:1.0.0
          # and restore the POSTGRES_* env vars (see the guide, section 7.2).
          image: hashicorp/http-echo:latest
          args:
            - "-listen=:3000"
            - "-text=Hello from the API (public test image)"
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: dev
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
